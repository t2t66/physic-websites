<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Physics Lessons</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="wrap"><div><h1><a href="/">Physics Lessons</a></h1><div class="sub">Scroll down for all lessons</div></div><a class="sub" href="/admin/">Admin</a></div></header>
<main class="wrap" id="feed"><p class="msg">Loading…</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script>
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{
  const {data,error}=await sb.from('lessons').select('*').order('created_at',{ascending:false});
  const f=document.getElementById('feed');
  if(error){f.innerHTML='<p class="msg err">'+esc(error.message)+'</p>';return}
  if(!data.length){f.innerHTML='<p class="msg">No lessons yet.</p>';return}
  f.innerHTML=data.map(l=>{
    const url=l.file_path?sb.storage.from('lessons').getPublicUrl(l.file_path).data.publicUrl:null;
    const pdf=url&&/\.pdf$/i.test(l.file_path);
    const embed=url?`<iframe loading="lazy" allowfullscreen src="${pdf?url:'https://view.officeapps.live.com/op/embed.aspx?src='+encodeURIComponent(url)}"></iframe><a class="btn" href="${url}" download>Download ${esc(l.file_name||'file')}</a>`:'';
    return `<article id="${l.id}"><span class="tag">${esc(l.unit||'General')}</span><h2>${esc(l.title)}</h2><div class="sub">${new Date(l.created_at).toLocaleDateString()}</div><p>${esc(l.description)}</p>${embed}${l.notes?`<p>${esc(l.notes).replace(/\n/g,'<br>')}</p>`:''}</article>`}).join('');
})();
</script></body></html>
